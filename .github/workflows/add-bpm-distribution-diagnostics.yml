name: Add BPM distribution diagnostics

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/add-bpm-distribution-diagnostics.yml"

permissions:
  contents: write

concurrency:
  group: add-bpm-distribution-diagnostics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add BPM rationale, median path, and skewness chart
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("nba-salary-gini")
          index = root / "index.html"
          js = root / "story.js"
          css = root / "story.css"

          text = index.read_text(encoding="utf-8")
          old = '''        <p>
                    EPM 缺少稳定、可复现的长期公开数据，因此这里使用 Basketball-Reference 的 BPM 作为历史代理。每季固定取总上场时间最高的 300 人，近似 30 队各 10 人轮换；也可切换到 240 人口径。
                  </p>'''
          new = '''        <p>
                    这里选择 BPM，首要原因是它从 1973–74 起具有一致的历史覆盖，能够完整覆盖本页从 1998–99 开始的研究窗口；其次，BPM 的 0 有明确的“联盟平均球员、每 100 回合贡献”含义。它并不是因为每季所有球员的简单算术平均数必然等于 0。
                  </p>'''
          assert old in text
          text = text.replace(old, new)

          anchor = '''      <div class="metric-warning card">
                  <strong>偏度不能单独证明“更多球员变强”。</strong>
                  <p>
                    当均值接近零时，右偏只表示少数高端球员拉出更长的正向尾部；多数球员仍可能低于零。主判断应看中位数、65 分位数和 BPM ≥ 0 的占比，偏度只作为分布形状的辅助诊断。
                  </p>
                </div>'''
          replacement = '''      <section class="bpm-rationale card" aria-label="为什么使用 BPM">
                  <div class="bpm-rationale-head">
                    <span class="section-kicker">Why BPM</span>
                    <h3>选择 BPM，主要是为了历史可比性；“0 = 联盟平均”是第二个优势</h3>
                  </div>
                  <div class="bpm-rationale-grid">
                    <article>
                      <strong>历史覆盖完整</strong>
                      <p>Basketball-Reference 的 BPM 可追溯至 1973–74；本页需要从 1998–99 开始，因此可以使用同一指标贯穿全部研究窗口。</p>
                    </article>
                    <article>
                      <strong>零点可解释</strong>
                      <p>BPM = 0 表示相对于联盟平均球员约为 0 分／100 回合。但按“球员人数”计算的简单平均或中位数并不被强制等于 0。</p>
                    </article>
                    <article>
                      <strong>公开且可复算</strong>
                      <p>BPM 只依赖长期可得的传统技术统计、位置和球队表现。EPM 更适合现代赛季，但公开历史从 2001–02 开始，不能覆盖 1998–99。</p>
                    </article>
                  </div>
                </section>

                <div class="metric-warning card">
                  <strong>偏度不能单独证明“更多球员变强”。</strong>
                  <p>
                    BPM 的联盟平均基准是 0，但这更接近上场时间／回合加权后的联盟中心。优秀球员通常获得更多分钟，因此按球员人数计，低于 0 的球员可能多于高于 0 的球员。右偏只表示高端尾部更长；主判断仍应看中位数、65 分位数和 BPM ≥ 0 的占比。
                  </p>
                </div>'''
          assert anchor in text
          text = text.replace(anchor, replacement)

          old_heat = '''            <div><h3>逐赛季 BPM 分布热力图</h3><p>每一行都是一张使用相同分箱的直方图；颜色越深，该 BPM 区间的球员越多。</p></div>'''
          new_heat = '''            <div><h3>逐赛季 BPM 分布热力图</h3><p>每一行都是相同分箱的直方图；金色折线连接每季固定轮换样本的 BPM 中位数。</p></div>'''
          assert old_heat in text
          text = text.replace(old_heat, new_heat)

          insert_after = '''      </section>

                <section class="card depth-interpretation">'''
          skew_section = '''      </section>

                <section class="chart-card card skewness-card">
                  <div class="card-head">
                    <div>
                      <h3>BPM 分布偏度：高端尾部是否越来越长</h3>
                      <p>单独绘制年度 skewness 与 5 年均值。正值表示高 BPM 一侧的尾巴更长，不等于多数轮换球员变强。</p>
                    </div>
                    <div class="legend" aria-label="BPM 偏度图图例">
                      <span class="legend-item"><span class="legend-line skew-line"></span>年度偏度</span>
                      <span class="legend-item"><span class="legend-line smooth"></span>5 年均值</span>
                      <span class="legend-item"><span class="legend-line zero-line"></span>对称分布（0）</span>
                    </div>
                  </div>
                  <div class="chart-wrap horizontal-chart">
                    <svg id="skewnessTrendChart" viewBox="0 0 1120 400" role="img" aria-label="NBA 固定轮换样本 BPM 偏度年度折线图"></svg>
                    <div id="skewnessTooltip" class="tooltip"></div>
                  </div>
                  <div id="skewnessNarrative" class="chart-narrative">—</div>
                </section>

                <section class="card depth-interpretation">'''
          assert insert_after in text
          text = text.replace(insert_after, skew_section, 1)

          old_method = '''          <p>EPM 是较合适的现代影响力指标，但缺少一条从 1998–99 起、公开可复现且口径稳定的完整下载序列。本页改用 Basketball-Reference BPM，以换取 27 个赛季的一致历史覆盖。</p>
                    <p>BPM 是相对于联盟环境的估计，不是跨时代绝对篮球技能测验。这里能检验的是“当季固定轮换样本的分布形状是否变化”，不能直接证明 2025 年角色球员在绝对能力上一定强于 2000 年角色球员。</p>'''
          new_method = '''          <p>选择 BPM 的首要原因是历史覆盖：Basketball-Reference 提供自 1973–74 起的 BPM，完整覆盖本页从 1998–99 开始的 27 个已完成赛季。BPM 还把 0 定义为相对联盟平均球员的每 100 回合贡献，因此跨赛季读数具有直观基准。<a href="https://www.basketball-reference.com/about/bpm2.html" target="_blank" rel="noreferrer">查看 BPM 2.0 方法说明</a>。</p>
                    <p>这里的“0”不意味着每季所有球员 BPM 的简单算术平均数必定为 0。BPM 的球队校准按上场回合／分钟加权；优秀球员通常获得更多分钟，所以按球员人数统计时，低于 0 的球员数量完全可能更多，中位数也可能低于 0。</p>
                    <p>EPM 是更丰富的现代影响力指标，使用比赛回合、技术统计和追踪数据，但其公开逐日历史从 2001–02 开始，无法覆盖 1998–99 至 2000–01。<a href="https://dunksandthrees.com/about/epm" target="_blank" rel="noreferrer">查看 EPM 方法与覆盖范围</a>。因此本页把 BPM 作为长期历史代理，而不是宣称 BPM 比 EPM 更准确。</p>
                    <p>BPM 是相对于联盟环境的估计，不是跨时代绝对篮球技能测验。这里能检验的是“当季固定轮换样本的分布形状是否变化”，不能直接证明 2025 年角色球员在绝对能力上一定强于 2000 年角色球员。</p>'''
          assert old_method in text
          text = text.replace(old_method, new_method)

          old_skew = '''          <p>正偏度表示高值一侧的尾巴更长，可能只是少数超级球星更突出。即使均值为零，也不能推出超过零的球员更多。判断中坚层应优先看固定样本的中位数、65 分位数以及 BPM ≥ 0 的占比。</p>
                    <p>本页仍保留偏度切换项，用于观察分布尾部是否拉长，并同时报告 P95−P65 差距，避免把“更长的明星尾部”误读成“角色球员整体右移”。</p>'''
          new_skew = '''          <p>正偏度表示高值一侧的尾巴更长，可能只是少数超级球星更突出。即使指标以联盟平均 0 为基准，也不能推出超过 0 的球员更多，因为按球员人数计算的分布并不要求均值为 0。判断中坚层应优先看固定样本的中位数、65 分位数以及 BPM ≥ 0 的占比。</p>
                    <p>本页现在单列年度偏度折线，并在热力图上叠加每季 BPM 中位数。二者结合可以区分“整个中部向右移动”与“只有明星尾部拉长”。</p>'''
          assert old_skew in text
          text = text.replace(old_skew, new_skew)
          text = text.replace("story.css?v=20260903-2", "story.css?v=20260903-3").replace("story.js?v=20260903-2", "story.js?v=20260903-3")
          index.write_text(text, encoding="utf-8")

          jst = js.read_text(encoding="utf-8")
          old_ids = '["contractChart", "performanceTrendChart", "performanceHeatmap", "performanceHistogram"]'
          assert old_ids in jst
          jst = jst.replace(old_ids, '["contractChart", "performanceTrendChart", "performanceHeatmap", "performanceHistogram", "skewnessTrendChart"]')
          old_render = '''    renderPerformanceTrend();
              renderPerformanceHeatmap();
              renderPerformanceHistogram();'''
          new_render = '''    renderPerformanceTrend();
              renderPerformanceHeatmap();
              renderSkewnessTrend();
              renderPerformanceHistogram();'''
          assert old_render in jst
          jst = jst.replace(old_render, new_render)

          heat_anchor = '''    const zeroX = margin.left + (0 - minBpm) / (maxBpm - minBpm) * innerW;
              svg.appendChild(node("line", { x1: zeroX, y1: margin.top - 7, x2: zeroX, y2: H - margin.bottom, stroke: css("--story-gold"), "stroke-width": 1.8, "stroke-dasharray": "4 4" }));'''
          heat_insert = '''    const medianPoints = rows.map((row, rowIndex) => {
                const value = Math.max(minBpm, Math.min(maxBpm, sampleMetric(row).median));
                return [margin.left + (value - minBpm) / (maxBpm - minBpm) * innerW, margin.top + rowIndex * rowH + rowH / 2];
              });
              if (medianPoints.length > 1) {
                svg.appendChild(node("path", { d: path(medianPoints), fill: "none", stroke: css("--surface-solid"), "stroke-width": 5.2, opacity: .78, "stroke-linecap": "round", "stroke-linejoin": "round" }));
                svg.appendChild(node("path", { d: path(medianPoints), fill: "none", stroke: css("--story-gold"), "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" }));
                medianPoints.forEach((point, index) => {
                  const selected = rows[index].end_year === story.performanceYear;
                  const dot = node("circle", { cx: point[0], cy: point[1], r: selected ? 4.2 : 2.3, fill: css("--story-gold"), stroke: css("--surface-solid"), "stroke-width": selected ? 1.6 : .8 });
                  dot.appendChild(node("title", {}, `${rows[index].season} · BPM 中位数 ${signed(sampleMetric(rows[index]).median, 2)}`));
                  svg.appendChild(dot);
                });
                svg.appendChild(node("line", { x1: margin.left + 8, y1: 17, x2: margin.left + 38, y2: 17, stroke: css("--story-gold"), "stroke-width": 2.4 }));
                svg.appendChild(node("text", { x: margin.left + 45, y: 21, fill: css("--muted"), "font-size": 10.5, "font-weight": 720 }, "每季 BPM 中位数"));
              }

              const zeroX = margin.left + (0 - minBpm) / (maxBpm - minBpm) * innerW;
              svg.appendChild(node("line", { x1: zeroX, y1: margin.top - 7, x2: zeroX, y2: H - margin.bottom, stroke: css("--story-gold"), "stroke-width": 1.8, "stroke-dasharray": "4 4" }));'''
          assert heat_anchor in jst
          jst = jst.replace(heat_anchor, heat_insert)

          insert_before = '''  function renderPerformanceHistogram() {'''
          skew_func = '''  function renderSkewnessTrend() {
              const svg = $("skewnessTrendChart");
              const tooltip = $("skewnessTooltip");
              if (!svg) return;
              svg.innerHTML = "";
              const rows = performanceRows();
              const values = rows.map(row => sampleMetric(row).skewness);
              const smooth = centered(values, 5);
              const W = 1120, H = 400, margin = { top: 34, right: 28, bottom: 66, left: 72 };
              const innerW = W - margin.left - margin.right, innerH = H - margin.top - margin.bottom;
              let min = Math.min(0, ...values, ...smooth.filter(Number.isFinite)) - .18;
              let max = Math.max(0, ...values, ...smooth.filter(Number.isFinite)) + .18;
              if (max - min < .8) { const mid = (max + min) / 2; min = mid - .4; max = mid + .4; }
              const x = index => margin.left + index * innerW / Math.max(1, rows.length - 1);
              const y = value => margin.top + (max - value) * innerH / Math.max(.0001, max - min);

              svg.appendChild(node("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }));
              for (let i = 0; i <= 5; i++) {
                const value = min + (max - min) * i / 5, yy = y(value);
                svg.appendChild(node("line", { x1: margin.left, y1: yy, x2: W - margin.right, y2: yy, stroke: css("--grid") }));
                svg.appendChild(node("text", { x: margin.left - 10, y: yy + 4, "text-anchor": "end", fill: css("--muted"), "font-size": 11 }, value.toFixed(1)));
              }
              if (min <= 0 && max >= 0) {
                svg.appendChild(node("line", { x1: margin.left, y1: y(0), x2: W - margin.right, y2: y(0), stroke: css("--muted-2"), "stroke-width": 1.7, "stroke-dasharray": "5 5" }));
                svg.appendChild(node("text", { x: W - margin.right, y: y(0) - 7, "text-anchor": "end", fill: css("--muted"), "font-size": 10.5 }, "偏度 = 0（对称）"));
              }
              const selectedIndex = rows.findIndex(row => row.end_year === story.performanceYear);
              if (selectedIndex >= 0) svg.appendChild(node("line", { x1: x(selectedIndex), y1: margin.top, x2: x(selectedIndex), y2: H - margin.bottom, stroke: css("--story-gold"), "stroke-dasharray": "3 4", opacity: .65 }));
              const smoothPoints = smooth.map((value, index) => Number.isFinite(value) ? [x(index), y(value)] : null).filter(Boolean);
              if (smoothPoints.length > 1) svg.appendChild(node("path", { d: path(smoothPoints), fill: "none", stroke: css("--accent"), "stroke-width": 3.2, opacity: .76, "stroke-linecap": "round" }));
              const points = values.map((value, index) => [x(index), y(value)]);
              svg.appendChild(node("path", { d: path(points), fill: "none", stroke: css("--story-purple"), "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }));
              rows.forEach((row, index) => {
                const value = values[index], selected = row.end_year === story.performanceYear, metric = sampleMetric(row);
                const circle = node("circle", { cx: x(index), cy: y(value), r: selected ? 6.2 : 4, fill: selected ? css("--surface-solid") : css("--story-purple"), stroke: css("--story-purple"), "stroke-width": selected ? 3 : 1.4, tabindex: 0 });
                circle.style.cursor = "pointer";
                const htmlText = `<strong>${row.season}</strong><div class="tooltip-row"><span>BPM 偏度</span><span>${signed(value, 2)}</span></div><div class="tooltip-row"><span>BPM 中位数</span><span>${signed(metric.median, 2)}</span></div><div class="tooltip-row"><span>BPM ≥ 0</span><span>${pct1.format(metric.thresholds["0"].share)}</span></div>`;
                circle.addEventListener("mouseenter", event => showTooltip(tooltip, event, htmlText));
                circle.addEventListener("mousemove", event => showTooltip(tooltip, event, htmlText));
                circle.addEventListener("mouseleave", () => hideTooltip(tooltip));
                circle.addEventListener("click", () => { story.performanceYear = row.end_year; $("performanceSeason").value = String(row.end_year); renderPerformance(); });
                svg.appendChild(circle);
              });
              rows.forEach((row, index) => {
                if (index % 3 !== 0 && index !== rows.length - 1) return;
                const xx = x(index);
                svg.appendChild(node("text", { x: xx, y: H - margin.bottom + 24, "text-anchor": "end", fill: css("--muted"), "font-size": 10.5, transform: `rotate(-42 ${xx} ${H - margin.bottom + 24})` }, row.season));
              });
              const early = eraRows(2000, 2005), recent = eraRows(2019, 2025);
              const earlySkew = average(early, row => sampleMetric(row).skewness);
              const recentSkew = average(recent, row => sampleMetric(row).skewness);
              if ($("skewnessNarrative")) $("skewnessNarrative").innerHTML = `早期平均偏度为 <strong>${signed(earlySkew, 2)}</strong>，近年为 <strong>${signed(recentSkew, 2)}</strong>。偏度上升表示高 BPM 尾部变长；只有当中位数、P65 或正 BPM 占比同步上升时，才有证据支持轮换中部也在右移。`;
            }

            function renderPerformanceHistogram() {'''
          assert insert_before in jst
          jst = jst.replace(insert_before, skew_func, 1)
          js.write_text(jst, encoding="utf-8")

          csst = css.read_text(encoding="utf-8")
          marker = "/* BPM rationale and distribution diagnostics */"
          assert marker not in csst
          csst += '''

          /* BPM rationale and distribution diagnostics */
          .bpm-rationale { display: grid; grid-template-columns: minmax(240px, .72fr) minmax(0, 2.28fr); gap: 18px; padding: 18px; margin-bottom: 14px; align-items: start; }
          .bpm-rationale-head h3 { margin: 2px 0 0; font-size: 1.03rem; line-height: 1.4; }
          .bpm-rationale-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
          .bpm-rationale-grid article { padding: 13px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-alt); }
          .bpm-rationale-grid strong { display: block; margin-bottom: 5px; font-size: .84rem; color: var(--text); }
          .bpm-rationale-grid p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.55; }
          .legend-line.skew-line { background: var(--story-purple); }
          .legend-line.zero-line { height: 2px; background: repeating-linear-gradient(90deg, var(--muted-2) 0 5px, transparent 5px 9px); }
          .skewness-card { margin-top: 18px; }
          .skewness-card .chart-narrative { margin-top: 2px; }
          @media (max-width: 980px) { .bpm-rationale { grid-template-columns: 1fr; } }
          @media (max-width: 720px) { .bpm-rationale-grid { grid-template-columns: 1fr; } }
          '''
          css.write_text(csst, encoding="utf-8")
          PY

          node --check nba-salary-gini/story.js
          grep -q "skewnessTrendChart" nba-salary-gini/index.html
          grep -q "medianPoints" nba-salary-gini/story.js
          grep -q "BPM rationale and distribution diagnostics" nba-salary-gini/story.css

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba-salary-gini/index.html nba-salary-gini/story.js nba-salary-gini/story.css
          git commit -m "Add BPM median path and skewness diagnostics"
          git push
