name: Update BPM visualization details

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update-bpm-visuals.yml"

permissions:
  contents: write

concurrency:
  group: update-bpm-visuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply BPM rationale and chart updates
        shell: bash
        run: |
          cat > /tmp/patch.py.gz.b64 <<'EOF'
          
          EOF
          base64 --decode /tmp/patch.py.gz.b64 | gzip -d > /tmp/patch.py
          python /tmp/patch.py
          node --check nba-salary-gini/story.js
          grep -q "performanceSkewnessChart" nba-salary-gini/index.html
          grep -q "medianPoints" nba-salary-gini/story.js
          grep -q "BPM 2.0 可追溯至 1973–74" nba-salary-gini/index.html

      - name: Commit updated website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-bpm-visuals.yml
          git add nba-salary-gini/index.html nba-salary-gini/story.js nba-salary-gini/story.css
          git commit -m "Clarify BPM baseline and add median and skewness charts"
          git push
