name: Finalize BPM median line style

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/finalize-bpm-lines.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render the heatmap median as a dashed trajectory
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path("nba-salary-gini/story.js")
          html_path = Path("nba-salary-gini/index.html")
          js = js_path.read_text(encoding="utf-8")
          html = html_path.read_text(encoding="utf-8")

          old_path = 'svg.appendChild(node("path", { d: path(medianPoints), fill: "none", stroke: css("--story-gold"), "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" }));'
          new_path = 'svg.appendChild(node("path", { d: path(medianPoints), fill: "none", stroke: css("--story-gold"), "stroke-width": 2.4, "stroke-dasharray": "5 4", "stroke-linecap": "round", "stroke-linejoin": "round" }));'
          old_key = 'svg.appendChild(node("line", { x1: margin.left + 8, y1: 17, x2: margin.left + 38, y2: 17, stroke: css("--story-gold"), "stroke-width": 2.4 }));'
          new_key = 'svg.appendChild(node("line", { x1: margin.left + 8, y1: 17, x2: margin.left + 38, y2: 17, stroke: css("--story-gold"), "stroke-width": 2.4, "stroke-dasharray": "5 4" }));'

          for label, old, new in (("median path", old_path, new_path), ("median key", old_key, new_key)):
              if js.count(old) != 1:
                  raise RuntimeError(f"{label}: expected one match, found {js.count(old)}")
              js = js.replace(old, new, 1)

          old_copy = "每一行都是相同分箱的直方图；金色折线连接每季固定轮换样本的 BPM 中位数。"
          new_copy = "每一行都是相同分箱的直方图；金色虚线连接每季固定轮换样本的 BPM 中位数。"
          if html.count(old_copy) != 1:
              raise RuntimeError(f"heatmap copy: expected one match, found {html.count(old_copy)}")
          html = html.replace(old_copy, new_copy, 1)

          js_path.write_text(js, encoding="utf-8")
          html_path.write_text(html, encoding="utf-8")
          PY
          node --check nba-salary-gini/story.js
          grep -q 'd: path(medianPoints).*stroke-dasharray' nba-salary-gini/story.js
          grep -q '金色虚线连接每季固定轮换样本' nba-salary-gini/index.html

      - name: Commit final website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-bpm-lines.yml .github/workflows/update-bpm-visuals.yml
          git add nba-salary-gini/index.html nba-salary-gini/story.js
          git commit -m "Use dashed median trajectory on BPM heatmap"
          git push
