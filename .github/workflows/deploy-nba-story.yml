name: Finalize NBA salary-value story data

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-nba-story.yml"

permissions:
  contents: write

concurrency:
  group: deploy-nba-salary-value-story
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete the historical rookie-scale series
        run: python nba-salary-gini/fix-rookie-scale.py

      - name: Validate code and rebuild public data
        run: |
          python -m py_compile nba-salary-gini/build-story-data.py
          node --check nba-salary-gini/story.js
          python nba-salary-gini/build-story-data.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("nba-salary-gini/data/story-data.json").read_text())
          contracts = payload["value_contracts"]
          assert payload["schema_version"] == 2
          assert len(contracts) == 28
          assert [row["end_year"] for row in contracts] == list(range(1999, 2027))
          assert all(row["rookie_scale_100"] for row in contracts)
          assert all(row["no1_salary_120"] for row in contracts)
          assert all(row["maximum_10_yos"] for row in contracts)
          assert all(row["minimum_0_yos"] for row in contracts)
          assert len(payload["performance"]) >= 25
          print("Validated 28 contract seasons and", len(payload["performance"]), "BPM seasons")
          PY

      - name: Commit completed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm nba-salary-gini/fix-rookie-scale.py
          git add nba-salary-gini/build-story-data.py nba-salary-gini/data/story-data.json
          git commit -m "Complete NBA rookie-scale salary series"
          git push
