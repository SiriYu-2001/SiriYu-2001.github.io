name: Build NBA salary-value story data

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "nba-salary-gini/build-story-data.py"
      - ".github/workflows/build-nba-story-data.yml"
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: write

concurrency:
  group: nba-salary-value-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build compact story data
        run: python nba-salary-gini/build-story-data.py

      - name: Commit generated data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba-salary-gini/data/story-data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update NBA salary-value story data"
            git push
          fi
